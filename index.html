<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taachaa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .social-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 0;
        }

        .card-social {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-social:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
        }

        .social-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-right: 20px;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .facebook { background: #1877f2; }
        .instagram { background: #e4405f; }
        .tiktok { background: #000000; }
        .twitter { background: #1da1f2; }
        .youtube { background: #ff0000; }

        .social-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .social-handle {
            color: #666;
            font-size: 14px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        /* Added styles for the image */
        .header-image {
            max-width: 200px; /* Adjust size as needed */
            height: auto;
            border-radius: 10px;
            margin: 0 auto 20px; /* Center the image and add space below */
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Optional shadow */
        }
    </style>
</head>
<body>
    <div class="social-container">
        <div class="container">
            <!-- Added image here -->
            <img src="/links/images/logo.png" alt="Taachaa Logo" class="header-image">
            <h1 class="text-center">Connect With Us</h1>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card-social d-flex align-items-center">
                        <div class="social-icon facebook">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                        <div>
                            <div class="social-title">Facebook</div>
                            <div class="social-handle"><a href="https://www.facebook.com/officialtaachaa">@officialtaachaa</a></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card-social d-flex align-items-center">
                        <div class="social-icon instagram">
                            <i class="fab fa-instagram"></i>
                        </div>
                        <div>
                            <div class="social-title">Instagram</div>
                            <div class="social-handle"><a href="https://www.instagram.com/taachaaofficial/">@taachaaofficial</a></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card-social d-flex align-items-center">
                        <div class="social-icon tiktok">
                            <i class="fab fa-tiktok"></i>
                        </div>
                        <div>
                            <div class="social-title">TikTok</div>
                            <div class="social-handle"><a href="https://www.tiktok.com/@taachaa_official/">@taachaa_official</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
